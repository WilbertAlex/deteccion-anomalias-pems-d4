name: Verificar entorno

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verificar-instalacion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar que los scripts no tengan errores de sintaxis
        run: |
          python -m py_compile *.py

      - name: Verificar configuraciones versionadas (JSON valido)
        run: |
          python -c "import json; json.load(open('config_preprocesamiento.json'))"
          echo "config_preprocesamiento.json es JSON valido"
